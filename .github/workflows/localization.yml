permissions:
  contents: write
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  update-localization:
    name: Update Localization
    runs-on: ubuntu-24.04

    steps:
      # Step 1: Check out the repository
      - name: Check out repository
        uses: actions/checkout@v6

      # Step 2: Extract texts (if needed, customize this for your format/tool):
      # NOT NEEDED FOR FLUTTER!

      # Step 3: Run doloc for translations
      - name: Translate with doloc
        id: doloc
        uses: doloc-io/doloc-action@v1
        with:
          token: ${{ secrets.DOLOC_API_TOKEN }}
          source: lib/l10n/app_en.arb
          targets: |
            lib/l10n/app_de.arb

      # Step 4: Check for changes and commit if needed
      - name: Commit translation updates
        if: steps.doloc.outputs.changed == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Update translations via doloc
          file_pattern: lib/l10n/app_de.arb
